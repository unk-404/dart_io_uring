name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            arch: x86_64
          # GitHub-hosted arm64 runner (public repositories / arm runners plan).
          # Replace with a self-hosted arm64 label if it is not available.
          - name: aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Environment
        run: |
          uname -a
          dart --version

      - name: Check io_uring availability
        run: |
          python3 - <<'PY'
          import ctypes
          import os

          class Params(ctypes.Structure):
              _fields_ = [
                  ("sq_entries", ctypes.c_uint32),
                  ("cq_entries", ctypes.c_uint32),
                  ("flags", ctypes.c_uint32),
                  ("sq_thread_cpu", ctypes.c_uint32),
                  ("sq_thread_idle", ctypes.c_uint32),
                  ("features", ctypes.c_uint32),
                  ("wq_fd", ctypes.c_uint32),
                  ("resv", ctypes.c_uint32 * 3),
                  ("sq_off", ctypes.c_uint32 * 10),
                  ("cq_off", ctypes.c_uint32 * 10),
              ]

          libc = ctypes.CDLL("libc.so.6", use_errno=True)
          params = Params()
          fd = libc.syscall(425, 8, ctypes.byref(params))
          if fd < 0:
              raise SystemExit(
                  "io_uring_setup failed: errno=%d; "
                  "this runner cannot exercise io_uring" % ctypes.get_errno()
              )
          os.close(fd)
          print("io_uring available, features=0x%x" % params.features)
          PY

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test --reporter expanded

      - name: Build AOT example
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          dart compile exe example/io_uring_example.dart -o "build/io_uring_example-${ARCH}"

      - name: Run AOT example
        env:
          ARCH: ${{ matrix.arch }}
        run: ./build/io_uring_example-${ARCH}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: io_uring-${{ matrix.arch }}
          path: build/
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: benchmark + assets
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark-svg-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install benchmark toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core build-essential

      - name: Run benchmarks and emit canonical JSON
        run: dart run benchmark/render_bench_svg.dart --emit-only

      - name: Render benchmark SVG
        uses: unk-404/benchmark_svg@master
        with:
          # benchmark/bench-svg.toml defines [[series]], so input is optional.
          format: json
          config: benchmark/bench-svg.toml
          out: assets/benchmarks.svg
          font_file: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Upload benchmark assets
        uses: actions/upload-artifact@v4
        with:
          name: io-uring-benchmark-svg
          path: |
            assets/benchmarks.svg
            build/benchmark_compare.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit refreshed chart
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/benchmarks.svg; then
            echo "Benchmark chart unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/benchmarks.svg
          git commit -m "chore(bench): refresh benchmark chart [skip ci]"
          git push
